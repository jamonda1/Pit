
# GitHub Actions에 표시될 워크플로 이름
name: Frontend CI

# 워크플로 실행 조건
on:
  # develop 또는 main 브랜치에 Push하면 실행
  push:
    branches: [develop, main]

  # develop 또는 main을 대상으로 PR을 생성하거나
  # 새로운 커밋을 Push하면 실행
  pull_request:
    branches: [develop, main]

# GitHub Actions에 부여할 권한
permissions:
  # 저장소 코드를 읽을 수 있는 최소 권한만 부여
  contents: read

# 실행할 작업(Job) 정의
jobs:
  # 작업 식별자 (추후 필수 Status Check로 사용)
  frontend-build:

    # GitHub에서 제공하는 Ubuntu 실행 환경
    runs-on: ubuntu-latest

    # 이 작업의 run 명령어에 적용할 기본 설정
    defaults:
      run:
        # 모든 run 명령어를 frontend/ 디렉토리에서 실행
        working-directory: frontend

    # 작업 내부에서 순서대로 실행할 단계(Step)
    steps:
      # 1. GitHub 저장소 코드를 실행 환경으로 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js 설치 및 npm 캐시 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 사용할 Node.js 버전
          node-version: "22"

          # npm 의존성 캐시 활성화
          # 이후 실행 시 의존성 다운로드 시간을 단축
          cache: npm

          # 모노레포이므로 frontend의 lock 파일을 지정
          cache-dependency-path: frontend/package-lock.json

      # 3. package-lock.json 기준으로 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 4. React 프로젝트의 프로덕션 빌드 검증
      - name: Build frontend
        run: npm run build
