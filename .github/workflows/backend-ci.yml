
# GitHub Actions에 표시될 워크플로 이름
name: Backend CI

# 워크플로 실행 조건
on:
  # develop 또는 main 브랜치에 Push하면 실행
  push:
    branches: [develop, main]

    # 백엔드 코드 또는 백엔드 CI 설정이 변경된 경우에만 실행
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

  # develop 또는 main을 대상으로 PR을 생성하거나
  # 새로운 커밋을 Push하면 실행
  pull_request:
    branches: [develop, main]

    # 백엔드 관련 변경 사항이 포함된 PR에서만 실행
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# GitHub Actions에 부여할 권한
permissions:
  # 저장소 코드를 읽을 수 있는 최소 권한만 부여
  contents: read

# 실행할 작업(Job) 정의
jobs:
  # 작업 식별자 (추후 필수 Status Check로 사용)
  backend-build:

    # GitHub에서 제공하는 Ubuntu 실행 환경
    runs-on: ubuntu-latest

    # 이 작업의 run 명령어에 적용할 기본 설정
    defaults:
      run:
        # 모든 run 명령어를 backend/ 디렉토리에서 실행
        working-directory: backend

    # 작업 내부에서 순서대로 실행할 단계(Step)
    steps:
      # 1. GitHub 저장소 코드를 실행 환경으로 가져오기
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Spring Boot 프로젝트 빌드에 사용할 Java 21 설치
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          # Eclipse Temurin OpenJDK 사용
          distribution: temurin

          # build.gradle에 설정된 Java 버전과 일치
          java-version: '21'

      # 3. Gradle 실행 환경 및 의존성 캐시 설정
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # GitHub Actions 기본 캐시를 사용하는 오픈소스 방식
          # 이후 실행 시 의존성 다운로드 시간을 단축
          cache-provider: basic

      # 4. Linux 환경에서 Gradle Wrapper 실행 권한 부여
      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      # 5. Spring Boot 프로젝트 빌드 및 테스트 검증
      - name: Build backend
        # clean: 기존 빌드 결과물 삭제
        # build: 컴파일, 테스트 및 JAR 생성
        # --no-daemon: CI 환경에서 Gradle Daemon 사용 제한
        run: ./gradlew clean build --no-daemon
